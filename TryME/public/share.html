<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trialix AI - Shared Virtual Look</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #FE3C72;
      --secondary: #0A0A0F;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--secondary);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Gradients */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      z-index: 1;
      pointer-events: none;
    }
    body::before {
      background: var(--primary);
      top: -100px;
      left: -100px;
    }
    body::after {
      background: #7C3AED;
      bottom: -100px;
      right: -100px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Brand Logo / Title */
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFF 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Glassmorphism Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 28px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 20px;
      overflow: hidden;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .outfit-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ai-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--primary);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(254, 60, 114, 0.3);
    }

    .info-section {
      width: 100%;
      text-align: center;
    }

    .outfit-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Redirect Spinner / Message */
    .redirect-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
      background: rgba(254, 60, 114, 0.08);
      border: 1px solid rgba(254, 60, 114, 0.15);
      padding: 8px 16px;
      border-radius: 12px;
      margin-top: 4px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Buttons */
    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 8px 20px rgba(254, 60, 114, 0.25);
      border: none;
    }

    .btn-primary:hover {
      background: #E03565;
      box-shadow: 0 10px 24px rgba(254, 60, 114, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* Footer Details */
    .footer {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">Trialix AI Studio</div>

    <div class="card">
      <div class="image-container">
        <img id="outfit-img" src="" alt="Shared Outfit" class="outfit-img">
        <div class="ai-badge">GEMINI AI</div>
      </div>

      <div class="info-section">
        <h2 id="outfit-title" class="outfit-title">Loading shared outfit...</h2>
        <p class="subtitle">Try on this style and see how it fits your body instantly with our cutting-edge AI.</p>
      </div>

      <div class="redirect-status" id="redirect-box">
        <div class="spinner"></div>
        <span>Opening in Trialix AI app...</span>
      </div>

      <div class="button-group">
        <a id="app-btn" href="#" class="btn btn-primary">Open in App</a>
        <a id="download-btn" href="#" class="btn btn-secondary">Download / Install App</a>
      </div>
    </div>

    <div class="footer">
      Powered by <a href="#">Trialix AI Engine</a> • 2026
    </div>
  </div>

  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const image = params.get('image');
    const desc = params.get('desc');

    const outfitImg = document.getElementById('outfit-img');
    const outfitTitle = document.getElementById('outfit-title');
    const redirectBox = document.getElementById('redirect-box');
    const appBtn = document.getElementById('app-btn');
    const downloadBtn = document.getElementById('download-btn');

    if (image) {
      const decodedImg = decodeURIComponent(image);
      const decodedDesc = desc ? decodeURIComponent(desc) : 'Shared Outfit Look';

      outfitImg.src = decodedImg;
      outfitTitle.innerText = decodedDesc;

      // Construct Native Deep Link
      const deepLink = `tryme://virtual-look?image=${encodeURIComponent(decodedImg)}&desc=${encodeURIComponent(decodedDesc)}`;
      
      appBtn.href = deepLink;
      // Suggested Download: Redirect to website fallback or instructions
      downloadBtn.href = "https://aura-ai-powered-fashion-aura.web.app/onboarding"; // Or directly download link if available

      // 1. Instantly trigger redirect to app
      window.location.href = deepLink;

      // 2. Trigger fallback iframe for iOS/Android deep linking stability
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deepLink;
      document.body.appendChild(iframe);

      // 3. Fallback: Update status text after 2 seconds if redirect didn't exit the page
      setTimeout(() => {
        redirectBox.style.background = 'rgba(255, 255, 255, 0.05)';
        redirectBox.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        redirectBox.querySelector('span').innerText = 'If the app did not open, please install it or click "Open in App"';
        redirectBox.querySelector('.spinner').style.display = 'none';
      }, 2000);
    } else {
      outfitTitle.innerText = 'No Outfit Loaded';
      outfitImg.src = 'https://images.unsplash.com/photo-1594932224010-70f90145c13b?w=500';
      redirectBox.style.display = 'none';
    }
  </script>
</body>
</html>
